<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tagesplaner</title>
  <meta name="description" content="Was jetzt dran ist, und was danach kommt. Lokal auf deinem Gerät.">
  <meta name="theme-color" content="#f3f0e8" id="meta-theme">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tagesplaner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('tagesplaner.v2') || '{}');
      var t = s.theme === 'dark' || s.theme === 'light' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <noscript><p class="noscript">Bitte JavaScript aktivieren. Der Plan bleibt auf diesem Gerät.</p></noscript>

  <main id="start" class="start" hidden>
    <div class="start-inner">
      <p class="kicker">Tagesplaner</p>
      <h1>Was jetzt.<br>Was danach.</h1>
      <p class="lead">Ein Blick genügt. Alles bleibt auf diesem Gerät.</p>
      <button id="start-go" class="btn" type="button">Los</button>
    </div>
  </main>

  <div id="app" class="app" hidden>
    <header class="top">
      <p id="greet" class="greet"></p>
      <p id="when" class="when"></p>
    </header>

    <p id="banner" class="banner" hidden></p>
    <section id="hero" class="hero" aria-live="polite"></section>
    <section id="next" hidden></section>
    <section id="rest" hidden></section>
    <section id="inbox-sec" hidden></section>

    <form id="add-form" class="composer">
      <label class="field">
        <span class="sr-only">Neue Aufgabe</span>
        <input id="add-title" type="text" maxlength="80" placeholder="Was steht an?" enterkeyhint="done" autocomplete="off" autocapitalize="sentences">
      </label>
    </form>
  </div>

  <dialog id="editor" class="sheet" aria-labelledby="ed-h">
    <form id="ed-form">
      <h2 id="ed-h">Ändern</h2>
      <label class="field">
        <span class="sr-only">Titel</span>
        <input id="ed-title" type="text" maxlength="80" autocomplete="off">
      </label>
      <p id="ed-when" class="when-lg"></p>
      <button type="submit" class="btn">Speichern</button>
      <button id="ed-delete" type="button" class="quiet danger">Löschen</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
